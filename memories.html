    /* Warm, neutral gallery treatment: the current image stays fully visible. */
    :root{--paper:var(--ui-bg);--ink:var(--ui-ink);--muted:var(--ui-muted);--line:var(--ui-line);--green:var(--ui-ink);--green-deep:#000;--wash:#f4f4f2;--danger:var(--ui-danger);--shadow:var(--ui-shadow-dialog)}
    body{background:var(--paper);font-family:var(--ui-font-sans)}
    .top{background:rgba(250,250,250,.94);border-bottom:1px solid var(--line);box-shadow:none;backdrop-filter:none}
    .top-action{background:var(--ink);box-shadow:0 4px 16px rgba(29,29,31,.1)}
    main{padding-top:42px}
    .intro{margin-bottom:22px}.intro h1{font-size:clamp(64px,7vw,96px)}
    .rail-shell{height:clamp(390px,calc(100vh - 270px),470px);min-height:390px;border-block:1px solid var(--line);border-radius:0;background:#f7f7f5}
    .rail-shell::after{content:none}
    .film-orbit{inset:0 0 52px}
    .orbit-photo{top:50%;bottom:auto;left:50%;width:clamp(150px,14vw,230px);height:clamp(210px,21vw,300px);padding:0;border:1px solid var(--line);border-radius:14px;background:var(--ui-surface);box-shadow:0 8px 24px rgba(29,29,31,.075);opacity:var(--o);transform:translate(-50%,-50%) translateX(var(--x)) scale(var(--s));transition:transform .72s var(--ui-ease-out),opacity .36s ease,box-shadow .22s ease}
    .orbit-photo img{display:block;width:100%;height:100%;object-fit:contain;border-radius:13px;background:#f1f1ef;filter:none}
    .orbit-photo.is-current{z-index:4;opacity:1;pointer-events:auto;box-shadow:0 12px 32px rgba(29,29,31,.11);transform:translate(-50%,-50%) translateX(var(--x)) scale(var(--s))}
    .orbit-photo.is-away{pointer-events:none}
    .film-actions{bottom:18px}
    .film-actions button{min-width:82px;padding:10px 18px;color:#fff;background:var(--ink);box-shadow:0 4px 16px rgba(29,29,31,.1)}
    .rail-empty button,.timeline-add,.primary{background:var(--ink);box-shadow:0 6px 18px rgba(29,29,31,.1)}

<body>
  <header class="top"><button class="back" id="back">← 返回</button><div class="brand">nono &amp; txx</div><span aria-hidden="true"></span></header>
  <main>
    <section class="intro"><h1>Memories</h1><div class="intro-copy"><b>OUR PRIVATE ARCHIVE</b>只收藏你们想留下的画面。</div></section>
    <section class="rail-shell" id="railShell" aria-label="按日期排列的胶片观片器"><div class="rail" id="rail"></div></section>
    <div class="section-head"><h2>时间线</h2><span id="count">00 MOMENTS</span></div>
    <nav class="year-nav" id="yearNav" aria-label="按年份浏览回忆"></nav>
    <section class="timeline" id="timeline"></section>
    <p class="storage-note">仅保存在这台电脑的当前浏览器中 · 刷新后保留 · 不会同步到其他设备 · 清理浏览器网站数据会删除这些内容</p>
  </main>

  <dialog id="photoManager"><div class="inner"><div class="dialog-head"><h2>管理图片</h2><button class="icon-close" data-close="photoManager" aria-label="关闭">×</button></div><form class="form" id="photoForm"><label class="field wide">批量添加图片（一次最多 12 张）<span class="file-box"><input id="photoFile" type="file" accept="image/*" multiple required></span></label><div class="form-actions"><button class="secondary" type="button" data-close="photoManager">取消</button><button class="primary" id="photoSave">添加所选图片</button></div><div class="manager-summary"><span id="managerCount">当前 0 张图片</span><button class="danger" id="managerDelete" type="button">删除当前图片</button></div></form></div></dialog>

  <dialog id="eventEditor"><div class="inner"><div class="dialog-head"><h2 id="eventEditorTitle">添加事件</h2><button class="icon-close" data-close="eventEditor" aria-label="关闭">×</button></div><form class="form" id="eventForm"><input id="eventId" type="hidden"><label class="field wide">事件标题<input id="eventTitle" required maxlength="60"></label><label class="field">日期<input id="eventDate" type="date" required></label><label class="field">事件类型<select id="eventType"><option value="minor">小事件 · 黑色标志</option><option value="major">大事件 · 红色标志</option></select></label><label class="field wide">地点（可选）<input id="eventPlace" maxlength="80"></label><label class="field wide">事件内容<textarea id="eventStory" maxlength="1200" placeholder="把这一天写下来"></textarea></label><label class="field wide">添加照片（可多选）<span class="file-box"><input id="eventImages" type="file" accept="image/*" multiple></span></label><div class="form-actions"><button class="secondary" type="button" data-close="eventEditor">取消</button><button class="primary" id="eventSave">保存事件</button></div></form></div></dialog>

  <dialog id="detail"><div class="detail-hero"><button class="icon-close" data-close="detail" aria-label="关闭">×</button><div class="detail-date" id="detailDate"></div><h2 id="detailTitle"></h2></div><div class="detail-body"><div class="detail-place" id="detailPlace"></div><p class="detail-story" id="detailStory"></p><div class="gallery" id="detailGallery"></div><div class="detail-actions"><button class="primary" id="detailAddImage">＋ 添加图片</button><button class="secondary" id="detailEdit">编辑事件</button><button class="danger" id="detailDelete">删除事件</button><input class="hidden" id="detailImageInput" type="file" accept="image/*" multiple></div></div></dialog>

  <dialog id="photoViewer"><div class="viewer"><button class="icon-close" data-close="photoViewer" aria-label="关闭">×</button><img id="viewerImage" alt="回忆照片"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/memory-library.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    // 隐藏曾误入回忆库的秘密页专用图片，不删除用户本地原记录。
    const privateImageSignature = { length: 37611, crc32: 1070910964 };
    const crc32Table = Array.from({length:256},(_,value)=>{let result=value;for(let bit=0;bit<8;bit++)result=(result&1)?0xedb88320^(result>>>1):result>>>1;return result>>>0});
    function crc32Text(text){let result=0xffffffff;for(let index=0;index<text.length;index++)result=crc32Table[(result^text.charCodeAt(index))&255]^(result>>>8);return (result^0xffffffff)>>>0}
    function isPrivateImage(image){const data=String(image?.data||'');if(data.length!==privateImageSignature.length)return false;try{return crc32Text(atob(data.slice(data.indexOf(',')+1)))===privateImageSignature.crc32}catch{return false}}
    const visibleImages = record => (record.images || []).filter(image => !isPrivateImage(image));
    console.assert(crc32Text('123456789')===0xcbf43926,'图片隐私指纹校验异常');
    let records = [], activeEventId = '', activePhoto = null, carouselPhotos = [], activePhotoIndex = 0, pendingPhotoId = '', railTimer = 0, railPaused = false, toastTimer, activeYear = 'all';
    let initialEventId = new URLSearchParams(location.search).get('event') || '';

    function toast(message, error = false) {
      const box = $('toast');
      box.textContent = message; box.className = `toast show${error ? ' error' : ''}`;
      clearTimeout(toastTimer); toastTimer = setTimeout(() => box.className = 'toast', 3200);
    }
    function readableError(error) {
      if (error && (error.name === 'QuotaExceededError' || /quota/i.test(error.message))) return '浏览器本地空间不足，请删除部分大图后再试。';
      return error?.message || '操作失败，请重试。';
    }
    function formatDate(date) { return String(date || '').replaceAll('-', '.'); }
    function allPhotos() {
      const photos = [];
      records.forEach(record => visibleImages(record).forEach(image => photos.push({recordId:record.id, kind:record.kind, title:record.title, date:image.uploadedAt || record.date, image})));
      return photos.sort((a,b) => String(a.date).localeCompare(String(b.date)) || String(a.image.id).localeCompare(String(b.image.id)));
    }

    function wrappedOffset(index, active, total) {
      let offset = (index - active + total) % total;
      if (offset > total / 2) offset -= total;
      return offset;
    }
    function orbitSlot(offset, total) {
      const radius = Math.min(3, Math.ceil((Math.min(total, 7) - 1) / 2));
      const distance = Math.abs(offset);
      if (distance > radius) return [offset < 0 ? -56 : 56, .84, 0];
      return [offset * (42 / Math.max(1, radius)), offset === 0 ? 1.08 : Math.max(.9, 1 - distance * .03), offset === 0 ? 1 : Math.max(.68, 1 - distance * .1)];
    }
    console.assert(wrappedOffset(0, 2, 5) === -2 && wrappedOffset(4, 2, 5) === 2, '胶片轨道位置计算异常');
    console.assert(orbitSlot(1,3)[0] === 42 && orbitSlot(3,7)[0] === 42 && orbitSlot(4,8)[2] === 0, '胶片铺满位置计算异常');
    function stopRail() { clearInterval(railTimer); railTimer = 0; }
    function startRail() {
      stopRail();
      if (carouselPhotos.length < 2 || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
      railTimer = setInterval(() => {
        if (!railPaused && !document.querySelector('dialog[open]')) setActivePhoto(activePhotoIndex + 1);
      }, 2400);
    }
    function setActivePhoto(index, animate = true) {
      if (!carouselPhotos.length) return;
      activePhotoIndex = (index + carouselPhotos.length) % carouselPhotos.length;
      $('rail').querySelectorAll('[data-photo-index]').forEach(button => {
        const offset = wrappedOffset(Number(button.dataset.photoIndex), activePhotoIndex, carouselPhotos.length);
        const values = orbitSlot(offset, carouselPhotos.length);
        button.classList.toggle('is-current', offset === 0);
        button.classList.toggle('is-away', values[2] === 0);
        button.setAttribute('aria-pressed', String(offset === 0));
        button.style.setProperty('--x', `${values[0]}vw`);
        button.style.setProperty('--s', values[1]);
        button.style.setProperty('--o', values[2]);
      });
    }

    function renderRail() {
      stopRail();
      const previousId = pendingPhotoId || carouselPhotos[activePhotoIndex]?.image.id;
      carouselPhotos = allPhotos();
      if (!carouselPhotos.length) {
        $('rail').innerHTML = '<div class="rail-empty"><div><b>等一张属于你们的照片</b><br><button id="emptyAdd">管理图片</button></div></div>';
        $('emptyAdd').onclick = openPhotoManager;
        return;
      }
      const matchedIndex = carouselPhotos.findIndex(photo => photo.image.id === previousId);
      activePhotoIndex = matchedIndex < 0 ? Math.min(activePhotoIndex, carouselPhotos.length - 1) : matchedIndex;
      pendingPhotoId = '';
      $('rail').innerHTML = `<div class="film-orbit">${carouselPhotos.map((photo, index) => `<button class="orbit-photo" data-photo-index="${index}" aria-label="查看第 ${index + 1} 张图片"><img src="${photo.image.data}" alt=""></button>`).join('')}</div><div class="film-actions"><button id="filmManage">管理</button></div>`;
      $('rail').querySelectorAll('[data-photo-index]').forEach(button => button.onclick = () => {
        const index = Number(button.dataset.photoIndex);
        if (index === activePhotoIndex) showPhoto(carouselPhotos[index]);
        else setActivePhoto(index);
        startRail();
      });
      $('filmManage').onclick = openPhotoManager;
      setActivePhoto(activePhotoIndex, false);
      startRail();
    }

    function eventYear(event) { return String(event.date || '').slice(0, 4); }
    function renderYearNav() {
      const years = [...new Set(records.filter(record => record.kind === 'event').map(eventYear).filter(Boolean))].sort().reverse();
      if (activeYear !== 'all' && !years.includes(activeYear)) activeYear = 'all';
      $('yearNav').innerHTML = ['all', ...years].map(year => `<button type="button" data-year="${year}" aria-pressed="${String(year === activeYear)}">${year === 'all' ? '全部' : year}</button>`).join('');
      $('yearNav').querySelectorAll('[data-year]').forEach(button => button.onclick = () => { activeYear = button.dataset.year; renderYearNav(); renderTimeline(); });
    }

    function renderTimeline() {
      const events = records.filter(record => record.kind === 'event' && (activeYear === 'all' || eventYear(record) === activeYear)).sort((a,b) => String(a.date).localeCompare(String(b.date)));
      $('count').textContent = `${String(events.length).padStart(2,'0')} MOMENTS`;
      if (!events.length) {
        $('timeline').innerHTML = '<div class="timeline-empty"><div><b>时间线还没有事件</b><button class="timeline-add" id="timelineAdd">＋ 添加事件</button></div></div>';
        $('timelineAdd').onclick = () => openEventEditor();
        return;
      }
      const day = value => new Date(`${value}T00:00:00`).getTime();
      const earliest = day(events[0].date), latest = day(events[events.length - 1].date), span = latest - earliest;
      const groups = new Map();
      events.forEach(event => { if (!groups.has(event.date)) groups.set(event.date, []); groups.get(event.date).push(event); });
      const marks = [...groups.entries()].map(([date, sameDay]) => {
        const position = span ? ((day(date) - earliest) / span) * 100 : 50;
        const edge = position < 8 ? ' edge-start' : position > 92 ? ' edge-end' : '';
        const buttons = sameDay.map((event, index) => `<button class="timeline-mark ${event.eventType === 'major' ? 'major' : 'minor'} ${(index + [...groups.keys()].indexOf(date)) % 2 ? 'lower' : ''}" data-event="${event.id}" aria-label="查看${event.eventType === 'major' ? '大' : '小'}事件：${esc(event.title)}"><span class="timeline-tip"><time>${formatDate(event.date)} · ${event.eventType === 'major' ? '大事件' : '小事件'}${event.isExample ? ' · 示例' : ''}</time><b>${esc(event.title)}</b><p>${esc(event.story || event.place || '点击查看这段回忆')}</p></span></button>`).join('');
        return `<div class="timeline-group${edge}" style="left:${position}%">${buttons}</div>`;
      }).join('');
      $('timeline').innerHTML = `<div class="timeline-stage"><div class="timeline-scale"><div class="timeline-axis"></div>${marks}<div class="timeline-range"><span>${formatDate(events[0].date)}</span><span>${formatDate(events[events.length - 1].date)}</span></div></div><div class="timeline-legend"><span class="major-key">大事件</span><span>小事件</span></div></div><button class="timeline-add" id="timelineAdd">＋ 添加事件</button>`;
      $('timeline').querySelectorAll('[data-event]').forEach(button => button.onclick = () => showEvent(button.dataset.event));
      $('timelineAdd').onclick = () => openEventEditor();
    }

    async function render() {
      try {
        records = await MemoryLibrary.all(); renderRail();
        const linkedEvent = initialEventId && records.find(record => record.id === initialEventId && record.kind === 'event');
        if (linkedEvent) activeYear = eventYear(linkedEvent) || 'all';
        renderYearNav(); renderTimeline();
        if (linkedEvent) { initialEventId = ''; showEvent(linkedEvent.id); }
      }
      catch (error) { toast(readableError(error), true); }
    }

    function openEventEditor(event) {
      $('eventEditorTitle').textContent = event ? '编辑事件' : '添加事件';
      $('eventId').value = event?.id || '';
      $('eventTitle').value = event?.title || '';
      $('eventDate').value = event?.date || MemoryLibrary.today();
      $('eventType').value = event?.eventType || 'minor';
      $('eventPlace').value = event?.place || '';
      $('eventStory').value = event?.story || '';
      $('eventImages').value = '';
      $('eventEditor').showModal();
    }

    function showEvent(id) {
      const event = records.find(record => record.id === id && record.kind === 'event');
      if (!event) return toast('这段回忆已不存在，请刷新后重试。', true);
      const images = visibleImages(event);
      activeEventId = id;
      $('detailDate').textContent = `${formatDate(event.date)}  ·  ${event.eventType === 'major' ? '大事件' : '小事件'}${event.isExample ? '  ·  示例事件' : ''}`;
      $('detailTitle').textContent = event.title;
      $('detailPlace').textContent = event.place ? `⌖ ${event.place}` : '';
      $('detailStory').textContent = event.story || '这一天还没有留下文字。';
      $('detailGallery').innerHTML = images.length ? images.map(image => `<div class="gallery-item"><img src="${image.data}" alt="${esc(image.caption || event.title)}"><button data-remove-image="${image.id}" aria-label="删除这张图片">×</button></div>`).join('') : '<span style="grid-column:1/-1;color:#969c96;font-size:11px">这段事件还没有照片</span>';
      $('detailGallery').querySelectorAll('[data-remove-image]').forEach(button => button.onclick = () => removeEventImage(button.dataset.removeImage));
      if (!$('detail').open) $('detail').showModal();
    }

    function openPhotoManager() {
      $('photoForm').reset();
      $('managerCount').textContent = `当前 ${carouselPhotos.length} 张图片`;
      $('managerDelete').disabled = !carouselPhotos.length;
      $('photoManager').showModal();
    }
    function showPhoto(photo) {
      activePhoto = photo;
      $('viewerImage').src = photo.image.data;
      if (!$('photoViewer').open) $('photoViewer').showModal();
    }

    async function deletePhoto(photo) {
      if (!photo || !confirm('确定删除当前照片吗？删除后无法恢复。')) return;
      const owner = records.find(record => record.id === photo.recordId);
      if (!owner) return toast('这张照片已不存在，请刷新后重试。', true);
      const nextPhoto = carouselPhotos.length > 1 ? carouselPhotos[(activePhotoIndex + 1) % carouselPhotos.length] : null;
      try {
        if (owner.kind === 'photo') await MemoryLibrary.remove(owner.id);
        else { owner.images = owner.images.filter(image => image.id !== photo.image.id); await MemoryLibrary.put(owner); }
        if ($('photoViewer').open) $('photoViewer').close();
        if ($('photoManager').open) $('photoManager').close();
        activePhoto = null; pendingPhotoId = nextPhoto?.image.id || '';
        await render(); toast('照片已删除');
      } catch (error) { toast(readableError(error), true); }
    }

    async function removeEventImage(imageId) {
      const event = records.find(record => record.id === activeEventId);
      if (!event || !confirm('确定删除这张图片吗？删除后无法恢复。')) return;
      try {
        event.images = event.images.filter(image => image.id !== imageId);
        await MemoryLibrary.put(event); await render(); showEvent(event.id); toast('图片已删除');
      } catch (error) { toast(readableError(error), true); }
    }

    $('photoForm').onsubmit = async event => {
      event.preventDefault(); const button = $('photoSave');
      if (button.disabled) return; button.disabled = true; button.textContent = '添加中…';
      try {
        const images = await MemoryLibrary.imagesFromFiles($('photoFile').files);
        const today = MemoryLibrary.today();
        for (const image of images) await MemoryLibrary.put({id:crypto.randomUUID(),kind:'photo',title:'一张照片',date:today,story:'',place:'',images:[image]});
        pendingPhotoId = images.at(-1)?.id || '';
        $('photoManager').close(); $('photoForm').reset(); await render(); toast(`${images.length} 张图片已添加`);
      } catch (error) { toast(readableError(error), true); }
      finally { button.disabled = false; button.textContent = '添加所选图片'; }
    };

    $('eventForm').onsubmit = async event => {
      event.preventDefault(); const button = $('eventSave');
      if (button.disabled) return; button.disabled = true; button.textContent = '保存中…';
      try {
        const old = records.find(record => record.id === $('eventId').value);
        const added = await MemoryLibrary.imagesFromFiles($('eventImages').files);
        if (added.length) pendingPhotoId = added.at(-1).id;
        await MemoryLibrary.put({id:old?.id || crypto.randomUUID(),kind:'event',title:$('eventTitle').value.trim(),date:$('eventDate').value,eventType:$('eventType').value,story:$('eventStory').value.trim(),place:$('eventPlace').value.trim(),images:[...(old?.images || []),...added],isExample:false});
        $('eventEditor').close(); await render(); toast(old ? '事件已更新' : '事件已加入时间线');
      } catch (error) { toast(readableError(error), true); }
      finally { button.disabled = false; button.textContent = '保存事件'; }
    };

    $('detailAddImage').onclick = () => $('detailImageInput').click();
    $('detailImageInput').onchange = async () => {
      const event = records.find(record => record.id === activeEventId);
      if (!event || !$('detailImageInput').files.length) return;
      try {
        const added = await MemoryLibrary.imagesFromFiles($('detailImageInput').files);
        pendingPhotoId = added.at(-1)?.id || '';
        event.images = [...event.images, ...added]; await MemoryLibrary.put(event); $('detailImageInput').value = '';
        await render(); showEvent(event.id); toast(`${added.length} 张图片已加入事件`);
      } catch (error) { toast(readableError(error), true); }
    };
    $('detailEdit').onclick = () => { const event = records.find(record => record.id === activeEventId); $('detail').close(); openEventEditor(event); };
    $('detailDelete').onclick = async () => {
      if (!activeEventId || !confirm('确定删除整个事件吗？其中的照片也会一起删除，且无法恢复。')) return;
      try { await MemoryLibrary.remove(activeEventId); $('detail').close(); activeEventId = ''; await render(); toast('事件已删除'); }
      catch (error) { toast(readableError(error), true); }
    };
    $('managerDelete').onclick = () => deletePhoto(carouselPhotos[activePhotoIndex]);
    document.querySelectorAll('[data-close]').forEach(button => button.onclick = () => $(button.dataset.close).close());
    $('railShell').onmouseenter = () => { railPaused = true; };
    $('railShell').onmouseleave = () => { railPaused = false; };
    document.addEventListener('visibilitychange', () => { railPaused = document.hidden; });
    $('back').onclick = () => { if (sessionStorage.getItem('nono-index-parent') === '1' && history.length > 1) { sessionStorage.removeItem('nono-index-parent'); sessionStorage.setItem('nono-index-reset','1'); history.back(); } else location.replace('index.html'); };
    render();
  </script>
</body>
</html>
