    (()=>{const playlist=[{title:'爱可以再更多一点点（原版）',src:'assets/music/love-can-be-more.mp3'}],button=$('musicToggle'),audio=$('musicAudio');let state='idle',timer=0,current=0;button.title=playlist[current].title;const setState=next=>{state=next;button.classList.remove('is-starting','is-playing','is-stopping');if(next!=='idle')button.classList.add(`is-${next}`);button.setAttribute('aria-pressed',String(next==='starting'||next==='playing'));button.setAttribute('aria-label',next==='idle'||next==='stopping'?'播放音乐':'暂停音乐')},later=next=>{clearTimeout(timer);timer=setTimeout(()=>setState(next),650)},ensureSource=()=>{if(!audio.getAttribute('src'))audio.src=playlist[current].src},play=()=>{ensureSource();return audio.play().catch(()=>{clearTimeout(timer);setState('idle')})};button.onclick=()=>{if(state==='idle'||state==='stopping'){setState('starting');play();later('playing')}else{setState('stopping');audio.pause();later('idle')}};audio.addEventListener('ended',()=>{current=(current+1)%playlist.length;audio.src=playlist[current].src;button.title=playlist[current].title;play()});audio.addEventListener('error',()=>{clearTimeout(timer);button.title='当前歌曲无法播放';setState('idle')})})();

    const profileLayer=$('profileLayer'),profilePortrait=$('profilePortrait'),profiles={girl:{src:'assets/girl-turn-side.mp4',header:'HER · PERSONAL ARCHIVE',kicker:'HER / PERSONAL NOTES',name:'nono',note:'关于她的故事，会在这里慢慢写下。',pronoun:'她',sign:'FOR NONO · WITH LOVE'},boy:{src:'assets/boy-turn-side-v2-web.mp4',header:'HIM · PERSONAL ARCHIVE',kicker:'HIM / PERSONAL NOTES',name:'txx',note:'关于他的故事，会在这里慢慢写下。',pronoun:'他',sign:'FOR TXX · WITH LOVE'}};
    function closeProfile(){ProfileGallery.stop();ProfileGallery.closeManager();profileLayer.classList.remove('is-open');profileLayer.setAttribute('aria-hidden','true');document.body.classList.remove('profile-open')}

    (()=>{const sequence=$('motionSequence'),girlVideo=$('girlMotion'),boyVideo=$('boyMotion'),end=2.8,reduce=matchMedia('(prefers-reduced-motion:reduce)');let scrollFrame=0;const videos=[girlVideo,boyVideo],limit=video=>Math.min(end,video.duration-.04),ease=p=>p*p*(3-2*p),canOpen=progress=>progress<.12,move=(video,progress,direction)=>video.style.setProperty('--motion-x',`${(direction*12*ease(progress)).toFixed(3)}vw`),showStill=()=>{videos.forEach(video=>{video.pause();video.style.opacity='1';video.classList.add('is-active');video.currentTime=0});move(girlVideo,0,-1);move(boyVideo,0,1)},showScroll=progress=>{videos.forEach(video=>{video.pause();video.style.opacity='1';video.classList.toggle('is-active',canOpen(progress))})},syncScroll=()=>{scrollFrame=0;if(document.body.classList.contains('profile-open')||(!reduce.matches&&videos.some(video=>video.readyState<2)))return;const distance=Math.max(1,sequence.offsetHeight-innerHeight),progress=Math.max(0,Math.min(1,(scrollY-sequence.offsetTop)/distance));if(reduce.matches||progress<.001){showStill();return}showScroll(progress);girlVideo.currentTime=limit(girlVideo)*progress;boyVideo.currentTime=limit(boyVideo)*progress;move(girlVideo,progress,-1);move(boyVideo,progress,1)},scheduleScroll=()=>{if(!scrollFrame)scrollFrame=requestAnimationFrame(syncScroll)},warmVideos=()=>{if(reduce.matches)return;videos.forEach(video=>{if(video.readyState<3){video.preload='auto';video.load()}})},scheduleWarmup=()=>{'requestIdleCallback'in window?requestIdleCallback(warmVideos,{timeout:1200}):setTimeout(warmVideos,350)},bind=(actor,person)=>{actor.addEventListener('click',()=>openProfile(person));actor.setAttribute('role','button');actor.setAttribute('tabindex','0');actor.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openProfile(person)}})};console.assert(canOpen(.119)&&!canOpen(.12),'人物主页入口滚动阈值异常');bind(girlVideo,'girl');bind(boyVideo,'boy');videos.forEach(video=>video.addEventListener(     (()=>{
      const sequence=$('motionSequence'),intro=$('archiveIntro'),cue=$('scrollCue'),lines=[...intro.querySelectorAll('.reveal-line')],reduce=matchMedia('(prefers-reduced-motion:reduce)');
      let frame=0;

      addEventListener('scroll',schedule,{passive:true});addEventListener('resize',schedule,{passive:true});sync();
