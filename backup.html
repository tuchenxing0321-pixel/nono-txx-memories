<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafafa">
  <link rel="icon" type="image/png" href="assets/site-logo-128.png"><link rel="stylesheet" href="assets/page-transitions.css">
  <title>备份与恢复 · nono &amp; txx</title>
  <style>
    :root{font-family:var(--ui-font-sans);color:var(--ui-ink);background:var(--ui-bg)}*{box-sizing:border-box}body{min-width:320px;margin:0;background:var(--ui-bg);-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}.top{display:grid;height:68px;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(22px,5vw,76px);border-bottom:1px solid var(--ui-line)}.back{justify-self:start;padding:8px 0;color:var(--ui-muted);border:0;background:none;font-size:12px}.brand{font:italic 19px/1 Georgia,serif}.status{justify-self:end;color:var(--ui-muted);font-size:10px;letter-spacing:.12em}main{width:min(960px,calc(100% - 64px));margin:auto;padding:clamp(72px,10vw,130px) 0 100px}.eyebrow{margin:0 0 18px;color:var(--ui-accent);font-size:10px;font-weight:700;letter-spacing:.2em}.intro{max-width:700px}.intro h1{margin:0;font:500 clamp(48px,7vw,82px)/.95 var(--ui-font-display);letter-spacing:-.06em}.intro>p:last-child{max-width:580px;margin:25px 0 0;color:var(--ui-muted);font-size:14px;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:64px}.card{display:flex;min-height:320px;flex-direction:column;padding:32px;border:1px solid var(--ui-line);border-radius:var(--ui-radius-md);background:var(--ui-surface)}.card-index{color:var(--ui-muted);font-size:10px;letter-spacing:.16em}.card h2{margin:44px 0 13px;font:500 30px/1.1 var(--ui-font-display);letter-spacing:-.04em}.card p{margin:0;color:var(--ui-muted);font-size:12px;line-height:1.75}.card-actions{display:flex;gap:9px;align-items:center;margin-top:auto;padding-top:28px}.primary,.secondary{min-height:42px;padding:0 17px;border-radius:var(--ui-radius-pill);font-size:12px;font-weight:700}.primary{color:#fff;border:1px solid var(--ui-ink);background:var(--ui-ink)}.secondary{color:var(--ui-ink);border:1px solid var(--ui-line);background:transparent}.primary:hover,.secondary:hover{transform:translateY(-1px)}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}.summary{margin-top:16px;padding:15px 0;border-top:1px solid var(--ui-line);color:var(--ui-muted);font-size:11px;line-height:1.7}.summary b{color:var(--ui-ink);font-weight:600}.notice{margin:30px 0 0;color:var(--ui-muted);font-size:11px;line-height:1.8}.notice strong{color:var(--ui-danger)}.toast{position:fixed;right:28px;bottom:28px;max-width:420px;padding:13px 17px;color:#fff;border-radius:12px;background:var(--ui-ink);box-shadow:var(--ui-shadow-dialog);font-size:12px;opacity:0;transform:translateY(9px);pointer-events:none;transition:opacity .2s,transform .25s var(--ui-ease-out)}.toast.show{opacity:1;transform:none}.toast.error{background:var(--ui-danger)}button:disabled{cursor:wait;opacity:.5}@media(max-width:700px){.top{padding:0 20px}.status{display:none}main{width:min(100% - 36px,960px);padding:62px 0 78px}.grid{grid-template-columns:1fr;margin-top:46px}.card{min-height:280px;padding:25px}.toast{right:18px;bottom:18px;left:18px;text-align:center}}
  </style>
</head>
<body>
  <header class="top"><button class="back" id="back" type="button">← 返回</button><div class="brand">nono &amp; txx</div><span class="status">LOCAL ONLY</span></header>
  <main>
    <section class="intro"><p class="eyebrow">DATA SAFETY</p><h1>备份与恢复</h1><p>把当前浏览器中的回忆、个人主页照片、视频链接和重要日期保存成一个文件。需要时，可以用这个文件恢复完整资料库。</p></section>
    <section class="grid">
      <article class="card"><span class="card-index">01 / EXPORT</span><h2>导出全部资料</h2><p>生成一个包含图片数据的 JSON 文件。文件只会下载到这台电脑，不会上传到任何服务器。</p><div class="card-actions"><button class="primary" id="export" type="button">下载备份</button></div><div class="summary" id="currentSummary">正在读取本地资料…</div></article>
      <article class="card"><span class="card-index">02 / RESTORE</span><h2>从备份恢复</h2><p>先选择备份文件并核对内容数量。只有再次点击“确认恢复”后，才会替换当前浏览器中的资料。</p><div class="card-actions"><label class="secondary file">选择备份文件<input id="importFile" type="file" accept="application/json,.json"></label><button class="primary" id="restore" type="button" hidden>确认恢复</button></div><div class="summary" id="importSummary">尚未选择备份文件。</div></article>
    </section>
    <p class="notice"><strong>请妥善保管：</strong>备份文件本身没有加密，可能包含私人照片和文字；请勿上传网盘公开链接或放进网站目录。</p>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/video-library.js"></script>
  <script src="assets/backup-library.js"></script>
  <script>
    const $=id=>document.getElementById(id);let pending=null,timer=0;
    const describe=value=>`回忆 ${value.memories} · 个人照片 ${value.profiles} · 视频 ${value.videos} · 日期 ${value.dates}`;
    function toast(message,error=false){clearTimeout(timer);$('toast').textContent=message;$('toast').classList.toggle('error',error);$('toast').classList.add('show');timer=setTimeout(()=>$('toast').classList.remove('show'),2600)}
    async function refresh(){try{const data=await BackupLibrary.snapshot();$('currentSummary').innerHTML=`当前内容：<b>${describe(BackupLibrary.counts(data))}</b>`}catch(error){$('currentSummary').textContent=error.message;toast(error.message,true)}}
    $('export').onclick=async()=>{const button=$('export');button.disabled=true;try{const data=await BackupLibrary.snapshot();BackupLibrary.download(data);toast('备份文件已生成。')}catch(error){toast(error.message||'备份失败，请重试。',true)}finally{button.disabled=false}};
    $('importFile').onchange=async()=>{pending=null;$('restore').hidden=true;const file=$('importFile').files[0];if(!file){$('importSummary').textContent='尚未选择备份文件。';return}try{pending=await BackupLibrary.fromFile(file);const count=BackupLibrary.counts(pending);$('importSummary').innerHTML=`文件日期：<b>${new Date(pending.createdAt).toLocaleString('zh-CN')}</b><br>包含：<b>${describe(count)}</b>`;$('restore').hidden=false}catch(error){$('importSummary').textContent=error.message;toast(error.message,true)}};
    $('restore').onclick=async()=>{if(!pending)return;if(!confirm('恢复会替换当前浏览器中的回忆、个人照片、视频和重要日期。确定继续吗？'))return;const button=$('restore');button.disabled=true;try{await BackupLibrary.restore(pending);toast('恢复完成，资料已重新载入。');pending=null;$('importFile').value='';button.hidden=true;$('importSummary').textContent='恢复完成。你可以返回各页面检查内容。';await refresh()}catch(error){toast(error.message||'恢复失败，原有资料已尽力保留。',true)}finally{button.disabled=false}};
    $('back').onclick=()=>{if(sessionStorage.getItem('nono-index-parent')==='1'&&history.length>1){sessionStorage.removeItem('nono-index-parent');sessionStorage.setItem('nono-index-reset','1');history.back()}else location.replace('index.html')};
    refresh();
  </script>
</body>
</html>
