<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" type="image/png" href="assets/site-logo-128.png">
  <link rel="apple-touch-icon" href="assets/site-logo.png">
  <link rel="stylesheet" href="assets/page-transitions.css">
  <title>重要日期 · nono &amp; txx</title>
  <style>
    :root{--paper:#f5f5f7;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:rgba(29,29,31,.1);--accent:#a45d63;--accent-soft:#f1e4e5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{min-width:320px;min-height:100%;margin:0;background:var(--paper);-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(164,93,99,.55);outline-offset:3px}
    .topbar{position:sticky;z-index:20;top:0;display:grid;height:68px;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(22px,5vw,76px);border:0;background:rgba(245,245,247,.82);box-shadow:0 12px 34px rgba(29,29,31,.035);backdrop-filter:saturate(180%) blur(20px)}
    .back,.add-top{border:0;background:none}.back{justify-self:start;padding:8px 0;color:#626267;font-size:12px;letter-spacing:.08em;transition:color .2s,transform .2s}.back:hover{color:var(--ink);transform:translateX(-3px)}.brand{font:italic 19px/1 Georgia,"Times New Roman",serif}.add-top{justify-self:end;padding:9px 14px;color:#fff;border-radius:999px;background:var(--ink);font-size:11px;letter-spacing:.05em;transition:transform .25s,background .25s}.add-top:hover{background:#38383c;transform:translateY(-1px)}
    main{width:min(1240px,calc(100% - 64px));margin:auto}.hero{position:relative;display:grid;min-height:calc(100svh - 68px);place-items:center;overflow:hidden;text-align:center}.hero::before{position:absolute;width:min(58vw,760px);aspect-ratio:1;border:1px solid rgba(164,93,99,.11);border-radius:50%;box-shadow:0 0 0 74px rgba(164,93,99,.025),0 0 0 148px rgba(164,93,99,.015);content:"";animation:breathe 8s ease-in-out infinite alternate}.hero-copy{position:relative;z-index:1;display:grid;justify-items:center}.eyebrow{margin:0 0 23px;color:var(--accent);font-size:10px;font-weight:650;letter-spacing:.24em}.hero h1{margin:0;font-size:clamp(30px,4vw,52px);font-weight:600;letter-spacing:-.045em}.countdown{display:flex;align-items:flex-end;margin:28px 0 24px}.countdown strong{font-size:clamp(112px,17vw,230px);font-weight:650;line-height:.72;letter-spacing:-.095em}.countdown span{margin:0 0 9px 12px;color:var(--muted);font-size:15px}.hero-date{margin:0;color:var(--muted);font-size:14px}.hero-date b{color:var(--ink);font-weight:550}.together{margin:13px 0 0;color:#959599;font-size:11px;letter-spacing:.08em}.scroll-cue{position:absolute;z-index:2;bottom:32px;left:50%;padding:8px;color:#8b8b8f;text-decoration:none;font-size:10px;letter-spacing:.12em;transform:translateX(-50%);transition:color .2s,transform .3s}.scroll-cue:hover{color:var(--ink);transform:translate(-50%,3px)}
    .archive{padding:clamp(92px,10vw,150px) 0 120px}.section-head{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;margin-bottom:34px}.section-kicker{margin:0 0 12px;color:var(--accent);font-size:10px;font-weight:650;letter-spacing:.2em}.section-head h2{margin:0;font:500 clamp(40px,6vw,74px)/.95 Georgia,"Songti SC",serif;letter-spacing:-.05em}.section-side{display:flex;gap:17px;align-items:center}.section-count{color:#85858a;font-size:10px;letter-spacing:.14em}.add-inline{padding:10px 15px;color:var(--ink);border:1px solid rgba(29,29,31,.16);border-radius:999px;background:transparent;font-size:11px;transition:background .2s,color .2s,border-color .2s}.add-inline:hover{color:#fff;border-color:var(--ink);background:var(--ink)}
    .date-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.date-card{position:relative;display:flex;min-height:270px;flex-direction:column;padding:32px;overflow:hidden;border-radius:28px;background:var(--card);box-shadow:0 18px 55px rgba(35,32,33,.045);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}.date-card:hover{box-shadow:0 26px 70px rgba(35,32,33,.075);transform:translateY(-4px)}.date-card.is-origin{grid-column:1/-1;min-height:330px;color:#fff;background:linear-gradient(145deg,#242326,#111113)}.date-card.is-origin::after{position:absolute;right:-7%;bottom:-58%;width:390px;aspect-ratio:1;border:1px solid rgba(255,255,255,.13);border-radius:50%;box-shadow:0 0 0 46px rgba(255,255,255,.025),0 0 0 92px rgba(255,255,255,.018);content:""}.card-top,.card-bottom{position:relative;z-index:1;display:flex;gap:14px;align-items:center;justify-content:space-between}.card-index{color:#9a9a9f;font-size:9px;font-weight:650;letter-spacing:.18em}.is-origin .card-index{color:#aaa7ad}.status{padding:6px 9px;color:var(--accent);border-radius:999px;background:var(--accent-soft);font-size:9px;font-weight:650;letter-spacing:.08em}.is-origin .status{color:#eee9eb;background:rgba(255,255,255,.1)}.card-main{position:relative;z-index:1;margin:auto 0}.card-date{display:block;margin-bottom:13px;color:#78787d;font-size:12px;letter-spacing:.14em}.is-origin .card-date{color:#aaa7ad}.card-main h3{margin:0;font-size:clamp(29px,3.5vw,48px);font-weight:580;line-height:1.06;letter-spacing:-.045em}.card-main p{max-width:530px;margin:17px 0 0;color:#85858a;font-size:13px;line-height:1.8}.is-origin .card-main p{color:#aaa7ad}.card-bottom{min-height:30px;justify-content:flex-end}.card-actions{display:flex;gap:6px}.card-actions button{padding:7px 10px;color:#76767b;border:0;border-radius:999px;background:#f2f2f4;font-size:9px}.card-actions button:hover{color:var(--ink);background:#e9e9ec}.card-actions .remove:hover{color:#923f47;background:#f5e5e6}.storage-note{margin:34px 0 0;color:#929297;text-align:center;font-size:10px;line-height:1.7}
    dialog{width:min(520px,calc(100% - 32px));padding:0;color:var(--ink);border:0;border-radius:28px;background:#fff;box-shadow:0 34px 110px rgba(20,20,22,.2)}dialog::backdrop{background:rgba(25,25,28,.32);backdrop-filter:blur(9px)}.dialog-inner{padding:30px}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px}.dialog-head h2{margin:0;font-size:28px;letter-spacing:-.04em}.dialog-head p{margin:7px 0 0;color:var(--muted);font-size:11px}.close{display:grid;width:32px;height:32px;padding:0;place-items:center;color:#6d6d72;border:0;border-radius:50%;background:#f1f1f3;font-size:17px}.form{display:grid;gap:18px}.field{color:#6f6f74;font-size:11px}.field input,.field textarea{display:block;width:100%;margin-top:8px;padding:12px 0;color:var(--ink);border:0;border-bottom:1px solid #d2d2d7;border-radius:0;background:transparent;outline:0}.field input:focus,.field textarea:focus{border-color:var(--accent)}.field textarea{min-height:92px;resize:vertical}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.dialog-actions button{padding:10px 17px;border:0;border-radius:999px;font-size:11px}.cancel{color:#626267;background:#f1f1f3}.save{color:#fff;background:var(--ink)}.toast{position:fixed;z-index:100;right:28px;bottom:28px;padding:12px 16px;color:#fff;border-radius:12px;background:#29292d;box-shadow:0 16px 45px rgba(0,0,0,.16);font-size:11px;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .25s,transform .25s}.toast.show{opacity:1;transform:none}.toast.error{background:#8a4148}
    @keyframes breathe{to{transform:scale(1.035);opacity:.72}}@media(max-width:700px){.topbar{height:64px;padding:0 20px}.brand{font-size:17px}.add-top{padding:8px 12px}main{width:min(100% - 36px,1240px)}.hero{min-height:calc(100svh - 64px)}.hero::before{width:84vw;box-shadow:0 0 0 38px rgba(164,93,99,.022),0 0 0 76px rgba(164,93,99,.013)}.countdown strong{font-size:clamp(96px,34vw,150px)}.countdown span{margin-bottom:5px}.section-head{align-items:flex-start}.section-side{flex-direction:column;align-items:flex-end}.date-grid{grid-template-columns:1fr}.date-card.is-origin{grid-column:auto}.date-card{min-height:250px;padding:25px;border-radius:22px}.date-card.is-origin{min-height:290px}.dialog-inner{padding:25px}.storage-note{padding:0 16px}.toast{right:18px;bottom:18px;left:18px;text-align:center}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

    /* Calm, neutral hierarchy with the existing rose reserved for state. */
    :root{--paper:var(--ui-bg);--card:var(--ui-surface);--ink:var(--ui-ink);--muted:var(--ui-muted);--line:var(--ui-line);--accent:var(--ui-accent);--accent-soft:#f3e8e9}
    body{background:var(--paper)}
    .topbar{height:var(--ui-header-height);padding:0 var(--ui-page-gutter);border-bottom:1px solid var(--line);background:rgba(250,250,250,.96);box-shadow:none;backdrop-filter:none}
    .brand{font:600 17px/1 var(--ui-font-display);letter-spacing:-.025em}
    .back:hover{transform:translateX(-2px)}
    .add-top{transition:background .18s,transform .18s}
    .add-top:hover{transform:translateY(-1px)}
    main{width:min(1240px,calc(100% - 96px))}
    .hero{min-height:clamp(500px,72svh,620px)}
    .hero::before{display:none;animation:none}
    .eyebrow{margin-bottom:18px}
    .hero h1{font-size:clamp(32px,3.5vw,46px)}
    .countdown{margin:25px 0 22px}
    .countdown strong{font-size:clamp(96px,13vw,168px);line-height:.76;letter-spacing:-.085em}
    .countdown span{margin:0 0 8px 10px;font-size:14px}
    .scroll-cue{bottom:20px;transition:color .18s,transform .2s}
    .scroll-cue:hover{transform:translate(-50%,2px)}
    .archive{padding:96px 0 112px}
    .section-head h2{font-size:clamp(42px,5vw,64px)}
    .add-inline{transition:background .18s,color .18s,border-color .18s}
    .date-grid{gap:16px}
    .date-card{min-height:242px;padding:30px;border:1px solid var(--line);border-radius:18px;box-shadow:none;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
    .date-card:hover{border-color:rgba(29,29,31,.16);box-shadow:0 12px 32px rgba(29,29,31,.055);transform:translateY(-2px)}
    .date-card.is-origin{min-height:282px;background:#202023}
    .date-card.is-origin::after{display:none}
    .is-origin .status{color:#f6e7e9;background:rgba(164,93,99,.28)}
    .card-main h3{font-size:clamp(28px,3vw,42px)}
    dialog{border:1px solid var(--line);border-radius:var(--ui-radius-lg);background:var(--ui-surface);box-shadow:var(--ui-shadow-dialog)}
    dialog::backdrop{background:rgba(25,25,28,.28);backdrop-filter:none}
    .dialog-head h2{font:500 30px/1.1 var(--ui-font-display);letter-spacing:-.035em}.dialog-head p{color:var(--muted)}
    .close{width:34px;height:34px;border-radius:9px;background:var(--ui-surface-soft)}
    .field{color:var(--muted)}.field input,.field textarea{border-color:var(--line)}
    .cancel{color:var(--ink);background:var(--ui-surface-soft)}
    .toast{background:var(--ui-ink);box-shadow:var(--ui-shadow-card)}.toast.error{background:var(--ui-danger)}
    @media(max-width:700px){main{width:min(100% - 36px,1240px)}.hero{min-height:clamp(470px,72svh,560px)}.countdown strong{font-size:clamp(88px,30vw,138px)}.date-card,.date-card.is-origin{min-height:240px;padding:25px;border-radius:18px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="topbar"><button class="back" id="back" type="button">← 返回</button><div class="brand">nono &amp; txx</div><button class="add-top" id="addTop" type="button">＋ 新增日期</button></header>
  <main>
    <section class="hero" aria-labelledby="pageTitle"><div class="hero-copy"><p class="eyebrow">NEXT ANNIVERSARY</p><h1 id="pageTitle">下一次周年</h1><div class="countdown" aria-live="polite"><strong id="countdownNumber">0</strong><span id="countdownUnit">天</span></div><p class="hero-date" id="heroDate"></p><p class="together" id="togetherDays"></p></div><a class="scroll-cue" href="#archive">查看全部日期 ↓</a></section>
    <section class="archive" id="archive" aria-labelledby="archiveTitle"><div class="section-head"><div><p class="section-kicker">DATES WE KEEP</p><h2 id="archiveTitle">重要日期</h2></div><div class="section-side"><span class="section-count" id="dateCount">01 DATES</span><button class="add-inline" id="addInline" type="button">＋ 新增</button></div></div><div class="date-grid" id="dateGrid"></div><p class="storage-note">日期仅保存在这台电脑的当前浏览器中 · 刷新后保留 · 暂不跨设备同步</p></section>
  </main>
  <dialog id="dateDialog"><div class="dialog-inner"><div class="dialog-head"><div><h2 id="dialogTitle">新增日期</h2><p>把一个值得记住的日子放在这里。</p></div><button class="close" id="closeDialog" type="button" aria-label="关闭">×</button></div><form class="form" id="dateForm"><input id="dateId" type="hidden"><label class="field">标题<input id="dateTitle" required maxlength="40" placeholder="例如：第一次旅行"></label><label class="field">日期<input id="dateValue" type="date" required></label><label class="field">简短备注<textarea id="dateNote" maxlength="120" placeholder="这一天为什么重要？"></textarea></label><div class="dialog-actions"><button class="cancel" id="cancelDialog" type="button">取消</button><button class="save" type="submit">保存日期</button></div></form></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const STORAGE='nono-important-dates-v1',ANNIVERSARY='2025-09-17',$=id=>document.getElementById(id),esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const validDate=value=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const parsed=new Date(`${value}T00:00:00Z`);return !Number.isNaN(parsed.getTime())&&parsed.toISOString().slice(0,10)===value};
    const dateValue=value=>Date.parse(`${value}T00:00:00Z`),daysBetween=(from,to)=>Math.round((dateValue(to)-dateValue(from))/86400000);
    const shanghaiToday=()=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).reduce((all,part)=>{if(part.type!=='literal')all[part.type]=part.value;return all},{});return `${parts.year}-${parts.month}-${parts.day}`};
    const nextAnniversary=today=>{const year=Number(today.slice(0,4)),thisYear=`${year}-09-17`;return thisYear<today?`${year+1}-09-17`:thisYear};
    console.assert(daysBetween('2025-09-17','2025-09-18')===1&&nextAnniversary('2026-10-15')==='2027-09-17','重要日期计算异常');
    let records=load(),toastTimer=0;
    function load(){try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'[]');return Array.isArray(saved)?saved.filter(item=>item&&typeof item.id==='string'&&typeof item.title==='string'&&validDate(item.date)).map(item=>({id:item.id,title:item.title.slice(0,40),date:item.date,note:String(item.note||'').slice(0,120)})):[]}catch{return[]}}
    function persist(next){try{localStorage.setItem(STORAGE,JSON.stringify(next));records=next;return true}catch{showToast('保存失败，请检查浏览器存储空间。',true);return false}}
    function formatDate(value){return new Intl.DateTimeFormat('zh-CN',{timeZone:'UTC',year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date(`${value}T00:00:00Z`))}
    function relativeLabel(value){const distance=daysBetween(shanghaiToday(),value);return distance===0?'就是今天':distance>0?`${distance} 天后`:`${Math.abs(distance)} 天前`}
    function showToast(message,error=false){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').classList.toggle('error',error);$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
    function updateHero(){const today=shanghaiToday(),next=nextAnniversary(today),distance=daysBetween(today,next),together=Math.max(1,daysBetween(ANNIVERSARY,today)+1);$('countdownNumber').textContent=distance===0?'今天':distance;$('countdownUnit').textContent=distance===0?'':'天';$('heroDate').innerHTML=distance===0?'<b>周年快乐</b>':`距离 <b>${esc(formatDate(next))}</b>`;$('togetherDays').textContent=`从 2025.09.17 开始 · 第 ${together} 天`}
    function card(item,index,origin=false){return `<article class="date-card${origin?' is-origin':''}"><div class="card-top"><span class="card-index">${String(index+1).padStart(2,'0')} / ${origin?'OUR BEGINNING':'SAVED DATE'}</span><span class="status">${esc(relativeLabel(item.date))}</span></div><div class="card-main"><time class="card-date" datetime="${esc(item.date)}">${esc(formatDate(item.date))}</time><h3>${esc(item.title)}</h3><p>${esc(item.note||'这一天还没有写下备注。')}</p></div><div class="card-bottom">${origin?'':`<div class="card-actions"><button type="button" data-edit="${esc(item.id)}">编辑</button><button class="remove" type="button" data-remove="${esc(item.id)}">删除</button></div>`}</div></article>`}
    function render(){const origin={date:ANNIVERSARY,title:'在一起的第一天',note:'故事从这里开始。'},sorted=records.slice().sort((a,b)=>a.date.localeCompare(b.date));$('dateGrid').innerHTML=card(origin,0,true)+sorted.map((item,index)=>card(item,index+1)).join('');$('dateCount').textContent=`${String(sorted.length+1).padStart(2,'0')} DATES`;$('dateGrid').querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>openDialog(records.find(item=>item.id===button.dataset.edit)));$('dateGrid').querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>removeDate(button.dataset.remove))}
    function openDialog(item){$('dateForm').reset();$('dateId').value=item?.id||'';$('dateTitle').value=item?.title||'';$('dateValue').value=item?.date||shanghaiToday();$('dateNote').value=item?.note||'';$('dialogTitle').textContent=item?'编辑日期':'新增日期';$('dateDialog').showModal();$('dateTitle').focus()}
    function removeDate(id){const item=records.find(record=>record.id===id);if(!item||!confirm(`确定删除“${item.title}”吗？`))return;const next=records.filter(record=>record.id!==id);if(persist(next)){render();showToast('日期已删除。')}}
    $('dateForm').onsubmit=event=>{event.preventDefault();const id=$('dateId').value,title=$('dateTitle').value.trim(),date=$('dateValue').value,note=$('dateNote').value.trim();if(!title||!validDate(date))return showToast('请填写有效的标题和日期。',true);const item={id:id||crypto.randomUUID(),title,date,note},next=id?records.map(record=>record.id===id?item:record):[...records,item];if(persist(next)){$('dateDialog').close();render();showToast(id?'日期已更新。':'日期已收藏。')}};
    $('addTop').onclick=$('addInline').onclick=()=>openDialog();$('closeDialog').onclick=$('cancelDialog').onclick=()=>$('dateDialog').close();$('dateDialog').onclick=event=>{if(event.target===$('dateDialog'))$('dateDialog').close()};$('back').onclick=()=>{if(sessionStorage.getItem('nono-index-parent')==='1'&&history.length>1){sessionStorage.removeItem('nono-index-parent');sessionStorage.setItem('nono-index-reset','1');history.back()}else location.replace('index.html')};
    updateHero();render();
  </script>
</body>
</html>
