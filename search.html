<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>搜索 · nono & txx</title>
  <link rel="stylesheet" href="assets/page-transitions.css">
  <style>
    :root{--ink:var(--ui-ink);--muted:var(--ui-muted);--line:var(--ui-line);--paper:var(--ui-bg);--accent:var(--ui-accent)}*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;color:var(--ink);background:var(--paper);font-family:var(--ui-font-sans)}.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:var(--ui-header-height);padding:0 var(--ui-page-gutter);border-bottom:1px solid var(--line);background:rgba(250,250,250,.94)}button{font:inherit}.back{justify-self:start;padding:8px 0;border:0;color:var(--muted);background:none;font-size:12px;cursor:pointer}.brand{font:600 17px/1 var(--ui-font-display);letter-spacing:-.025em}.shell{width:min(960px,calc(100% - 56px));margin:auto;padding:clamp(72px,9vw,112px) 0 110px}.eyebrow{margin:0 0 15px;color:var(--accent);font:650 10px/1 var(--ui-font-sans);letter-spacing:.18em}.title{margin:0;font:500 clamp(48px,6vw,72px)/1.02 var(--ui-font-display);letter-spacing:-.045em}.lead{max-width:480px;margin:21px 0 44px;color:var(--muted);font-size:13px;line-height:1.8}.search-box{position:relative}.search-box input{width:100%;height:62px;padding:0 54px 0 20px;color:var(--ink);border:1px solid var(--line);border-radius:var(--ui-radius-md);outline:0;background:var(--ui-surface);font-size:16px;box-shadow:none;transition:border-color .2s,box-shadow .2s}.search-box input:focus{border-color:rgba(29,29,31,.24);box-shadow:var(--ui-shadow-card)}.search-box svg{position:absolute;top:20px;right:20px;width:21px;height:21px;fill:none;stroke:var(--muted);stroke-width:1.5}.summary{display:flex;justify-content:space-between;margin:19px 2px 25px;color:var(--ui-faint);font:10px/1 ui-monospace,monospace;letter-spacing:.12em}.results{border-top:1px solid var(--line)}.result{display:grid;grid-template-columns:96px 1fr auto 22px;gap:22px;align-items:center;min-height:112px;padding:23px 6px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;transition:background .2s,transform .22s var(--ui-ease-out)}.result:hover,.result:focus-visible{outline:0;background:var(--ui-surface);transform:translateY(-1px)}.result-type{color:var(--accent);font:650 9px/1 ui-monospace,monospace;letter-spacing:.13em}.result h2{margin:0 0 8px;font:500 20px/1.2 var(--ui-font-display)}.result p{max-width:610px;margin:0;overflow:hidden;color:var(--muted);font-size:12px;line-height:1.6;text-overflow:ellipsis;white-space:nowrap}.result time{color:var(--ui-faint);font:10px/1 ui-monospace,monospace;letter-spacing:.08em}.arrow{color:var(--ui-faint);font-size:19px}.empty{padding:70px 0;border-bottom:1px solid var(--line);color:var(--muted);text-align:center;font-size:13px}.empty b{display:block;margin-bottom:10px;color:var(--ink);font:500 25px var(--ui-font-display)}@media(max-width:650px){.shell{width:calc(100% - 34px);padding-top:55px}.lead{margin-bottom:32px}.result{grid-template-columns:72px 1fr;gap:12px}.result time{display:none}.arrow{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="top"><button class="back" id="back">← 返回</button><div class="brand">nono &amp; txx</div><span></span></header>
  <main class="shell">
    <p class="eyebrow">FIND IN OUR ARCHIVE</p>
    <h1 class="title">搜索</h1>
    <p class="lead">在回忆、地点、日期和视频名称中，找到你们留下的内容。</p>
    <label class="search-box"><span hidden>搜索内容</span><input id="query" type="search" placeholder="试试输入地点、年份或视频名称" autocomplete="off" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"></circle><path d="m16 16 4.2 4.2"></path></svg></label>
    <div class="summary"><span id="status">正在读取档案</span><span>MEMORIES · DATES · VIDEO</span></div>
    <section class="results" id="results" aria-live="polite"></section>
  </main>
  <script src="assets/memory-library.js"></script>
  <script src="assets/video-library.js"></script>
  <script>
    const $=id=>document.getElementById(id),esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const normalize=value=>String(value||'').trim().toLocaleLowerCase('zh-CN');
    const matches=(value,query)=>normalize(query).split(/\s+/).filter(Boolean).every(word=>normalize(value).includes(word));
    const sortable=date=>String(date||'').replaceAll('.','-');
    const formatDate=date=>String(date||'').replaceAll('-','.');
    const datesKey='nono-important-dates-v1';
    let items=[];
    console.assert(matches('上海 2026.10.01','上海 2026')&&!matches('上海','北京'),'统一搜索匹配异常');

    function savedDates(){try{const value=JSON.parse(localStorage.getItem(datesKey));return Array.isArray(value)?value:[]}catch{return []}}
    async function load(){
      const memories=(await MemoryLibrary.all()).filter(item=>item.kind==='event').map(item=>({type:'回忆',title:item.title||'未命名回忆',date:item.date,description:[item.place,item.story].filter(Boolean).join(' · '),search:[item.title,item.place,item.story,item.date,formatDate(item.date)].join(' '),href:`memories.html?event=${encodeURIComponent(item.id)}`}));
      const videos=VideoLibrary.read(),videoItems=['vlog','dancee'].flatMap(category=>videos[category].map(item=>({type:'视频',title:item.autoName||item.name||'未命名视频',date:item.date,description:category==='vlog'?'VLOG':'DANCE',search:[item.autoName,item.name,item.date,category].join(' '),href:item.url||'video.html',external:Boolean(item.url)})));
      const important=[{id:'anniversary',title:'在一起的第一天',date:'2025-09-17',note:'nono & txx'} ,...savedDates()].map(item=>({type:'日期',title:item.title||'重要日期',date:item.date,description:item.note||'',search:[item.title,item.note,item.date,formatDate(item.date)].join(' '),href:'dates.html#archive'}));
      items=[...memories,...important,...videoItems].sort((a,b)=>sortable(b.date).localeCompare(sortable(a.date)));
      render();
    }
    function render(){
      const query=$('query').value,visible=query.trim()?items.filter(item=>matches(item.search,query)):items;
      $('status').textContent=query.trim()?`找到 ${visible.length} 条结果`:`共 ${visible.length} 条内容`;
      if(!visible.length){$('results').innerHTML='<div class="empty"><b>没有找到</b>换一个关键词、地点或年份试试。</div>';return}
      $('results').innerHTML=visible.map(item=>`<a class="result" href="${esc(item.href)}"${item.external?' target="_blank" rel="noopener noreferrer"':''}><span class="result-type">${item.type}</span><div><h2>${esc(item.title)}</h2><p>${esc(item.description||'打开查看')}</p></div><time>${esc(formatDate(item.date))}</time><span class="arrow" aria-hidden="true">↗</span></a>`).join('');
    }
    $('query').addEventListener('input',render);
    $('back').onclick=()=>{if(sessionStorage.getItem('nono-index-parent')==='1'){sessionStorage.removeItem('nono-index-parent');sessionStorage.setItem('nono-index-reset','1');location.href='index.html'}else if(history.length>1)history.back();else location.href='index.html'};
    load().catch(error=>{$('status').textContent='读取失败';$('results').innerHTML=`<div class="empty"><b>暂时无法读取</b>${esc(error?.message||'请刷新后重试')}</div>`});
  </script>
</body>
</html>
